name: Refresh traffic CSVs

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-traffic
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Use current LTS on GitHub Actions (stable + has built-in fetch).
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci --omit=dev

      - name: Fetch + build CSVs (latest 500)
        env:
          AUTH_URL: ${{ secrets.AUTH_URL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          AUDIENCE: ${{ secrets.AUDIENCE }}
          PARTY: ${{ secrets.PARTY }}
          LEDGER_URL: ${{ secrets.LEDGER_URL }}
          INDEXER_TIP_BACKLOG: "300000"
          # GitHub Pages should point at /public (see README).
          OUTPUT_DIR: "public"
          # Prevent unbounded growth of CSV/JSONL files in scheduled runs.
          APPEND: "false"
        run: |
          set -euo pipefail
          node -v
          npm -v
          mkdir -p public docs

          # Generate new files first; only overwrite committed ones on success.
          rm -f public/*.tmp || true
          echo "Running fetch_tx_traffic.js..."
          OUTPUT_DIR="public" node scripts/fetch_tx_traffic.js
          node scripts/filter_4types_csv.js public/tx_traffic.csv public/tx_traffic_4types.csv
          node scripts/trim_csv.js public/tx_traffic.csv 500
          node scripts/trim_csv.js public/tx_traffic_4types.csv 500
          node scripts/trim_csv.js public/tx_kb_data.csv 500

          # Keep docs/ in sync for repos that still use docs/ as the Pages root.
          cp -f public/tx_traffic.csv docs/tx_traffic.csv
          cp -f public/tx_traffic_4types.csv docs/tx_traffic_4types.csv
          cp -f public/tx_kb_data.csv docs/tx_kb_data.csv

          # Fail fast if generation didn't produce files (prevents silent Pages 404s).
          test -s public/tx_traffic.csv
          test -s public/tx_traffic_4types.csv
          test -s public/tx_kb_data.csv
          test -s docs/tx_traffic.csv
          test -s docs/tx_traffic_4types.csv
          test -s docs/tx_kb_data.csv

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Public directory contents:"
          ls -la public

          # Force-add in case any ignore rules still match.
          # Don't commit tx_data.jsonl here — it grows without bound and can exceed GitHub's 100MB limit.
          git add -f public/tx_traffic.csv public/tx_traffic_4types.csv public/tx_kb_data.csv || true
          git add -f docs/tx_traffic.csv docs/tx_traffic_4types.csv docs/tx_kb_data.csv || true
          git commit -m "chore: refresh traffic CSVs" || exit 0
          git push

